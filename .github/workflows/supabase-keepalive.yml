name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 * * *"        # daily 03:00 UTC
  workflow_dispatch: {}         # manual run from the Actions tab
  

permissions:
  contents: read
  issues: write                 # lets the failure step open an issue

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call health-check Edge Function (with retries)
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}   # https://<ref>.supabase.co/functions/v1
          HC_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
        run: |
          set -u
          if [ -z "${FUNCTIONS_URL}" ] || [ -z "${HC_SECRET}" ]; then echo "::error::Missing repository secrets"; exit 1; fi
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 30 -X POST \
              -H "x-healthcheck-secret: ${HC_SECRET}" -H "Content-Type: application/json" \
              -d "{\"source\":\"github-actions-${GITHUB_EVENT_NAME}\"}" \
              "${FUNCTIONS_URL}/health-check" || echo 000)
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then echo "Keep-alive OK at $(date -u +%FT%TZ)"; exit 0; fi
            if [ "${code}" = "401" ]; then echo "::error::Secret rejected (401). Not retrying."; exit 1; fi
            sleep $((attempt * 20))
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1

      - name: Open an issue if the check failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Supabase keep-alive FAILED $(date -u +%F)" \
            --body "The scheduled health check failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Check whether the Supabase project is paused (Dashboard > Restore)."
